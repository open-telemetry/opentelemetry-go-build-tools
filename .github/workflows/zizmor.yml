name: Zizmor

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '37 8 * * 2' # weekly at 08:37 UTC on Tuesday
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read # for actions/checkout
      security-events: write # for zizmor to upload SARIF results
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@94425809b433630371efafff2067f2c5b19f3fc2 # v0.5.0
