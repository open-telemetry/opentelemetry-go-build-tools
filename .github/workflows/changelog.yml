name: changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  changelog:
    permissions:
      contents: read
      pull-requests: read
    uses:  open-telemetry/shared-workflows/.github/workflows/chloggen.yml@cb9f45f0b1ec545091caca504fc3e9b073284325 # v0.20.0
